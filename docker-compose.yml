# MADU Platform Docker Compose
# تشغيل منصة الدينار المغاربي الرقمي مع جميع الخدمات

version: '3.8'

services:
  # قاعدة بيانات MongoDB
  mongodb:
    image: mongo:7.0
    container_name: madu-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: madu-platform
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - madu-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis للتخزين المؤقت
  redis:
    image: redis:7.2-alpine
    container_name: madu-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - madu-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # شبكة البلوك تشين (Ganache للتطوير)
  ganache:
    image: trufflesuite/ganache:latest
    container_name: madu-ganache
    restart: unless-stopped
    command: >
      ganache
      --host 0.0.0.0
      --port 8545
      --networkId 2026
      --chainId 2026
      --accounts 10
      --mnemonic "madu development test network private key seed phrase here"
      --deterministic
    ports:
      - "8545:8545"
    networks:
      - madu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 30s
      timeout: 10s
      retries: 3

  # خدمة API الرئيسية
  api:
    build:
      context: .
      target: production
    container_name: madu-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/madu-platform?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-madu-super-secret-jwt-key-2024}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-madu-encryption-key-256-bit-secure}
      TESTNET_RPC_URL: http://ganache:8545
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "3000:3000"
    networks:
      - madu-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ganache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # واجهة المستخدم الأمامية
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: madu-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://api:3000/api/v1
      REACT_APP_ENVIRONMENT: production
    ports:
      - "80:80"
    networks:
      - madu-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx كخادم عكسي
  nginx:
    image: nginx:alpine
    container_name: madu-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "443:443"
      - "8080:80"
    networks:
      - madu-network
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # خدمة المراقبة والسجلات
  prometheus:
    image: prom/prometheus:latest
    container_name: madu-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - madu-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # لوحة تحكم المراقبة
  grafana:
    image: grafana/grafana:latest
    container_name: madu-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - madu-network
    depends_on:
      - prometheus

  # ElasticSearch للبحث والتحليل
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: madu-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - madu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana لتصور البيانات
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: madu-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - madu-network
    depends_on:
      elasticsearch:
        condition: service_healthy

# الشبكات
networks:
  madu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# المجلدات الدائمة
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# خدمات إضافية للتطوير
services:
  # محرر قاعدة البيانات
  mongo-express:
    image: mongo-express:latest
    container_name: madu-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-admin123}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin123}
    ports:
      - "8081:8081"
    networks:
      - madu-network
    depends_on:
      - mongodb
    profiles:
      - development

  # مراقب Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: madu-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    ports:
      - "8082:8081"
    networks:
      - madu-network
    depends_on:
      - redis
    profiles:
      - development

  # خدمة البريد الإلكتروني للتطوير
  mailhog:
    image: mailhog/mailhog:latest
    container_name: madu-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - madu-network
    profiles:
      - development